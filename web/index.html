<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    Alternatively, build your application passing the --base-href parameter
    specifying the new root path of your web app.

    Fore more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EXPEDION ENCHERES">

  

  

  <!-- Favicon. The SVG is what modern browsers pick up and it stays crisp at
       any tab or bookmark size; the PNGs are the fallback, and Safari reads
       the apple-touch-icon when the site is added to a home screen. -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png"/>
  <link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png"/>
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180"/>
  <!-- theme-color is set further down, per colour scheme — don't add an
       unconditional one here or it wins over the light-mode variant. -->


  <!-- Open Graph & SEO tags -->
  <meta property="og:title" content="Expedion Enchères — Vos lots livrés chez vous" />
  <meta property="og:description" content="Expedion enlève votre achat à la maison de ventes, l'emballe et le livre chez vous. Un prix fixe, un seul suivi, zéro coup de fil." />
  <meta property="og:image" content="/assets/assets/images/1cbd084bc5eb4fddba058d26b8cab44f.png" />
  <meta name="twitter:title" content="Expedion Enchères — Vos lots livrés chez vous" />
  <meta name="twitter:description" content="Expedion enlève votre achat à la maison de ventes, l'emballe et le livre chez vous. Un prix fixe, un seul suivi, zéro coup de fil." />
  <meta name="twitter:image" content="/assets/assets/images/1cbd084bc5eb4fddba058d26b8cab44f.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <title>Expedion Enchères</title>
  <meta name="description" content="Enlèvement, emballage et livraison de vos lots de ventes aux enchères, partout en France métropolitaine. Devis sous 48 heures." />
    

  <!-- Status Bar color in Safari browser (iOS) and PWA.
       These are the site's `--bg` in each theme, so the browser chrome meets
       the page rather than banding against it. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5f8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#08090b">

  <link rel="manifest" href="manifest.json">

  <!-- Google Identity Services client, read by `google_sign_in_web`.
       This meta tag is the only channel the plugin accepts on web — the
       `serverClientId` constructor argument is explicitly unsupported there —
       and without it the Google button renders but authenticates nobody.

       The value is public: it already travels in the OAuth consent URL, and it
       is the same client Expeditoo's Better Auth signs in with, which is what
       makes a Google sign-in here land on the same account as a Google sign-in
       on Expeditoo. The secret half of the pair lives only on the server.

       The matching console entry is Authorized JavaScript origins on this
       client, which must list every origin the app is served from. That list
       is not reachable from any code in this repository — see
       scripts/auth-preflight.mjs for the checks that are. -->
  <meta name="google-signin-client_id"
        content="563376260248-glji5g26dr3os58dil8n6uu4ghlit70c.apps.googleusercontent.com">

</head>
<body>
  
  
  
  <script src="https://js.stripe.com/v3/"></script>
  
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
