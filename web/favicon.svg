<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Expedion">
  <!--
    The EXPEDION mark: an amber ring holding a blue dot, trailed by two amber
    speed bars. Same geometry as XpdLogoMark in lib/design_system/ds_logo.dart,
    scaled 1.5x from that widget's 30px base so the lockup fills a 64 box.

    Background is deliberately transparent. A dark plate would vanish into a
    dark browser tab strip, and amber reads on both light and dark chrome.

    The wordmark is omitted: at 16px it is an unreadable smudge, and the ring
    is what identifies the brand at that size.
  -->
  <circle cx="26" cy="32" r="19.9" fill="none" stroke="#FFA91F" stroke-width="5.25"/>
  <circle cx="26" cy="32" r="6.75" fill="#0052FF"/>
  <rect x="45.5" y="23.75" width="15" height="6" rx="3" fill="#FFA91F"/>
  <rect x="45.5" y="34.25" width="9" height="6" rx="3" fill="#FFA91F" opacity="0.45"/>
</svg>
